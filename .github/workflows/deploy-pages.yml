name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it: a cancelled Pages
# deployment can leave the site in a half-published state.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.1-stable
  # Export templates live in a directory named after the literal contents of the
  # archive's version.txt — dots, no "-stable" suffix.
  GODOT_TEMPLATE_DIR: 4.7.1.stable

jobs:
  # ---------------------------------------------------------------------------
  # The gate. `build` needs this, so nothing reaches Pages without passing it.
  #
  # This job exists because six deploys of this project went green while the
  # shipped build had no physics core in it. `godot --headless --export-release`
  # returns exit 0 with scripts missing — it writes the .pck, writes the .wasm,
  # and every size assertion downstream of it passes. GDScript resolves
  # `class_name` at parse time, so the failure only appears in a browser. A
  # successful export is not evidence that the export contains the program, and
  # this job is what supplies that evidence.
  # ---------------------------------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-latest
    # The GDScript suite runs in ~6 s and pytest in ~65 s. The ceiling is here
    # to turn a hang into a red job quickly rather than to accommodate one.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Godot
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          template-dir: ${{ env.GODOT_TEMPLATE_DIR }}
          export-templates: "false" # no export here; skip the 1.28 GB archive

      - name: Install Python dependencies
        # The runner's own Python, deliberately: every other action here is
        # pinned by commit SHA, and adding `actions/setup-python` would mean
        # adding a pin that has not been verified against this repo. The
        # pipeline only needs numpy/scipy/pytest, all pinned in
        # tools/requirements.txt, and any Python the runner ships has wheels
        # for them.
        run: |
          set -euo pipefail
          python3 -VV
          python3 -m pip install --upgrade pip
          python3 -m pip install -r tools/requirements.txt

      # --- guards that need no engine -------------------------------------
      - name: Every resource main.tscn needs is committed
        run: python3 tools/ci/check_scene_refs.py

      - name: Committed aero data matches the pipeline that generates it
        # Exits 1 if `game/data/**` has drifted from what tools/aero would bake
        # today, so hand-edited coefficients cannot ship.
        run: python3 -m tools.aero.bake --check

      - name: Python suite (tools/aero)
        run: python3 -m pytest tools/aero -q

      # --- guards that need the engine ------------------------------------
      - name: Import Godot project
        working-directory: game
        run: |
          # A cold import is flaky and can exit nonzero while still doing useful
          # work, so run it twice and tolerate failure. It is required before
          # the resource check below, which is specifically about `class_name`
          # resolution and therefore needs the global script-class cache.
          godot --headless --import . || true
          godot --headless --import . || true

      - name: Every script in the scene actually compiles
        # `load()` returns a non-null GDScript for a script whose class_name
        # dependencies are missing, and `PackedScene.instantiate()` still hands
        # back a Node. `GDScript.reload()` is what reports the parse error, and
        # that is what this check gates on.
        run: |
          set +e -uo pipefail
          timeout 300 godot --headless --path game --script res://tests/check_resources.gd
          rc=$?
          if [ "$rc" -eq 124 ]; then
            echo "::error::resource check HUNG (no exit within 300 s) — this is a"\
                 "runner defect, not a test failure. See game/tests/run_tests.gd"\
                 "on the _process vs _iteration trap."
            exit 1
          fi
          exit "$rc"

      - name: GDScript physics suite
        # Runs in ~6 s. Wrapped in `timeout` because the one previous failure
        # mode here was a HANG, not a red test: the runner's frame callback was
        # named `_iteration` (Godot 3's MainLoop virtual), which Godot 4 never
        # calls, so the suite printed "196 passed" and then span forever with no
        # exit code. A hang that silently eats runner minutes is worse than a
        # red build, and it must not be confusable with a real failure — hence
        # the explicit 124 branch.
        run: |
          set +e -uo pipefail
          timeout 300 godot --headless --path game --script res://tests/run_tests.gd
          rc=$?
          if [ "$rc" -eq 124 ]; then
            echo "::error::physics suite HUNG (no exit within 300 s). The suite"\
                 "normally finishes in ~6 s. This is a runner-termination defect,"\
                 "NOT a failing test — check game/tests/run_tests.gd::_process."
            exit 1
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::error::physics suite FAILED (exit $rc) — see the FAIL lines above."
          fi
          exit "$rc"

      - name: Puzzle suite and level replay gate
        # Replays every shipped level's intended_solution through the real
        # PuzzleSession and asserts the landing against the measurement baked
        # into the level file, to +/- 0.5 m.
        #
        # This is a physics regression test wearing level content as its
        # fixture. The ten levels were designed against the SHIPPED integrator —
        # every distance in them is a measurement, not an estimate — so a change
        # to PRECESSION_GAIN, a coefficient table, the portal transform, the
        # per-room environment split or the event locator does not make the game
        # subtly worse, it fails here with the metre error printed. Without it a
        # level can silently become unsolvable and nobody finds out until a
        # player cannot gold Level 9.
        #
        # Separate from the physics suite because it is owned by a different
        # track and gates different content; both must pass before `build` runs.
        run: |
          set +e -uo pipefail
          timeout 300 godot --headless --path game --script res://tests/run_puzzle_tests.gd
          rc=$?
          if [ "$rc" -eq 124 ]; then
            echo "::error::puzzle suite HUNG (no exit within 300 s). It normally"\
                 "finishes in ~3 s. That is a runner-termination defect, NOT a"\
                 "failing test — see the _process vs _iteration note in"\
                 "game/tests/run_tests.gd."
            exit 1
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::error::level replay gate FAILED (exit $rc). A shipped level no"\
                 "longer plays the way it was measured — see the FAIL lines above"\
                 "for which level and by how many metres."
          fi
          exit "$rc"

  build:
    name: Export game and build site
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Godot
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          template-dir: ${{ env.GODOT_TEMPLATE_DIR }}
          export-templates: "true"

      - name: Import Godot project
        working-directory: game
        run: |
          # A cold import is flaky and can exit nonzero while still doing useful
          # work, so run it twice and tolerate failure. The export step below is
          # the real gate.
          godot --headless --import . || true
          godot --headless --import . || true

      - name: Export web build
        working-directory: game
        run: |
          set -euo pipefail
          mkdir -p ../web/public/game
          # Exit code is the only valid success signal here. --export-release
          # prints ERROR: lines for non-fatal conditions, so do NOT grep for
          # "ERROR" — `set -e` plus the size assertions below are the contract.
          # Note that exit 0 does NOT mean the build contains the program; the
          # `test` job is what establishes that.
          godot --headless --export-release "Web" ../web/public/game/index.html

      - name: Assert export produced a usable build
        run: |
          set -euo pipefail
          test -s web/public/game/index.wasm
          test -s web/public/game/index.pck
          test -s web/public/game/index.js
          test -s web/public/game/index.html
          ls -l web/public/game
          echo "wasm bytes: $(stat -c%s web/public/game/index.wasm)"

      - name: The pack actually contains the program
        # The strongest check in the pipeline: everything before it reasons
        # about the source tree, this one reads the artefact about to be
        # uploaded. `--export-release` exits 0 with scripts missing.
        run: python3 tools/ci/check_pck_contents.py web/public/game/index.pck

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install site dependencies
        working-directory: web
        run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build site
        working-directory: web
        # base_path has no trailing slash; Vite requires one, hence the "/".
        run: npm run build -- --base="${{ steps.pages.outputs.base_path }}/"

      - name: Verify the export survived the bundle intact
        run: |
          set -euo pipefail
          # public/ is copied verbatim: Godot derives index.wasm / index.pck from
          # its own basename at runtime, so any hashing or renaming breaks it.
          diff -r web/public/game web/dist/game
          echo "dist/game is byte-identical to the export"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
